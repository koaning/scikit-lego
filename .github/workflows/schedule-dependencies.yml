name: Cron Test Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"


jobs:
  # Unpinned install, so this is the job that sees new upstream releases first.
  # The newest Python is not optional here: major releases drop old interpreters, so a
  # 3.10-only matrix silently caps "latest" (pandas 3 and scikit-learn 1.9 both require >=3.11).
  cron-base:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        os: [macos-latest, ubuntu-latest, windows-latest]
        pre-release-dependencies: ["--pre", ""]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      if: always()
      run: |
        python -m pip install wheel
        python -m pip install ${{ matrix.pre-release-dependencies }}  -e ".[test]"
        python -m pip freeze
    - name: Test with pytest
      if: always()
      run: pytest -n auto --disable-warnings --cov=sklego -m "not cvxpy and not formulaic and not umap"

  cron-extra:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        os: [macos-latest, ubuntu-latest, windows-latest]
        pre-release-dependencies: [
          # "--pre",
          "",
        ]
        extra: ["cvxpy", "formulaic", "umap"]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      if: always()
      run: |
        python -m pip install wheel
        python -m pip install ${{ matrix.pre-release-dependencies }} -e ".[test,${{ matrix.extra }}]"
        python -m pip freeze
    - name: Test with pytest
      if: always()
      run: pytest -n auto --disable-warnings --cov=sklego -m "${{ matrix.extra }}"

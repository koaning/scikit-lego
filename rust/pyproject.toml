[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sklego-rust"
version = "0.1.0"
description = "Rust kernels for the EMeans and EGaussianMixture estimators of scikit-lego"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26.4"]

[tool.maturin]
features = ["extension-module"]
module-name = "sklego_rust"
